name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The Pages deployment needs these permissions. They are granted here, per
# workflow, so nothing else in the repository gains write access.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; queue rather than cancel so a push is never
# silently dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve base path
        id: base
        env:
          # `configure-pages` reports the final origin and path, which covers
          # project pages, user/organisation pages and custom domains alike.
          RESOLVED_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          path="${RESOLVED_PATH:-/}"
          # Vite needs a trailing slash, and an empty path means the site root.
          case "$path" in
            "" | "/") base="/" ;;
            */) base="$path" ;;
            *) base="$path/" ;;
          esac
          echo "Using Vite base: $base"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.base }}
          # Optional: point at your own PeerServer / TURN by setting these as
          # repository variables. Leaving them empty keeps the free defaults.
          VITE_PEER_HOST: ${{ vars.VITE_PEER_HOST }}
          VITE_PEER_PORT: ${{ vars.VITE_PEER_PORT }}
          VITE_PEER_PATH: ${{ vars.VITE_PEER_PATH }}
          VITE_PEER_SECURE: ${{ vars.VITE_PEER_SECURE }}
          VITE_PEER_KEY: ${{ vars.VITE_PEER_KEY }}
          VITE_ICE_SERVERS: ${{ vars.VITE_ICE_SERVERS }}
        run: npm run build

      - name: Add SPA fallback
        run: |
          # GitHub Pages cannot rewrite unknown paths, so a copy of index.html
          # is served as 404.html. Routing itself uses the URL hash, so this is
          # only a safety net for mistyped paths. (`.nojekyll` and `robots.txt`
          # come from `public/`, which Vite copies verbatim.)
          cp dist/index.html dist/404.html
          test -f dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
