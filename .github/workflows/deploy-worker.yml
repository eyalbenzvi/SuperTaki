name: Deploy relay worker

# The relay deploys from the default branch, like Pages, and only when the
# worker itself changed. `workflow_dispatch` covers the first deploy and
# redeploys after a Cloudflare-side change.
on:
  push:
    branches: ['**']
    # `src/**` belongs here as much as `worker/**` does, and leaving it out was a
    # silent staleness bug rather than a tidy filter. The room compiles the game
    # itself out of the app's source — `gameRoom.ts` imports the engine, the bot
    # policy, the robot names and every timing constant from `../../src/features`
    # — so a change there changes what the deployed room *does* while touching
    # nothing under `worker/`. That is exactly what happened: the rules fix, the
    # robot pacing and the robot names all landed on main, Pages published the
    # client, and the room went on dealing human-named robots because no push had
    # matched this list. Anything the worker can compile has to be able to
    # redeploy it; docs, tests and the root README still cannot.
    paths:
      - 'worker/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref_name == github.event.repository.default_branch
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # And the app's, because the worker compiles `../src/features/game/**` and those
      # files resolve `zod` upward from themselves — a walk that reaches the repository
      # root and never passes `worker/node_modules`. Without this the typecheck fails
      # and nothing deploys. See the same step in `ci.yml`.
      - name: Install the app's dependencies
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Typecheck and test
        run: npm run verify

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker

      - name: Report the relay URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## Relay deployed"
            echo ""
            echo "Worker URL: ${DEPLOYMENT_URL:-see the wrangler output above}"
            echo ""
            echo 'Set the repository variable `RELAY_URL` to this URL with the'
            echo '`wss://` scheme (for example `wss://supertaki-relay.example.workers.dev`)'
            echo 'so the Pages build points the game at it.'
          } >> "$GITHUB_STEP_SUMMARY"
