<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Super Taki - a private, zero-cost peer-to-peer Taki game that runs entirely in the browser."
    />
    <!--
      Content Security Policy.

      - `connect-src` allows the free public PeerJS signalling service, WebSocket
        signalling and STUN/TURN candidates. Add your own PeerServer or TURN host
        here if you configure one.
      - No `unsafe-inline` for scripts; Vite emits external modules only.
      - Styles need `unsafe-inline` because the app sets `color-scheme` on the
        root element at runtime and Vite injects a style tag in dev.
      - `frame-ancestors` is deliberately absent: it is ignored in a <meta> tag
        and GitHub Pages cannot send real response headers. Nothing in this app
        holds credentials, so clickjacking has no target.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               base-uri 'self';
               object-src 'none';
               form-action 'none';
               img-src 'self' data:;
               style-src 'self' 'unsafe-inline';
               font-src 'self';
               script-src 'self';
               connect-src 'self' https://0.peerjs.com wss://0.peerjs.com https://*.peerjs.com wss://*.peerjs.com stun: turn: turns:;
               manifest-src 'self'"
    />
    <!-- The wordmark's four suit colours, inline so the icon costs no request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314141b'/%3E%3Crect x='4' y='4' width='11' height='11' rx='2.5' fill='%23e4002b'/%3E%3Crect x='17' y='4' width='11' height='11' rx='2.5' fill='%23ffcc00'/%3E%3Crect x='4' y='17' width='11' height='11' rx='2.5' fill='%2300843d'/%3E%3Crect x='17' y='17' width='11' height='11' rx='2.5' fill='%230057b8'/%3E%3C/svg%3E"
    />
    <title>Super Taki</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Super Taki needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
